[project]
name = "netbox-resources-operator"
version = "0.1.0"
description = "A Kubernetes operator to manage NetBox resources"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "apischema>=0.19.0",
    "glom>=24.11.0",
    "kopf>=1.38.0",
    "prometheus-client>=0.23.1",
    "pydantic>=2.12.2",
    "pydantic-settings>=2.11.0",
    "pykube-ng>=23.6.0",
    "pynetbox>=7.5.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "coverage>=7.10.7",
    "ruff>=0.14.11",
]

[tool.coverage.run]
relative_files = true
