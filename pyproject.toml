[project]
name = "netbox-resources-operator"
version = "0.1.0"
description = "A Kubernetes operator to manage NetBox resources"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "apischema>=0.19.0",
    "glom>=24.11.0",
    "kopf>=1.44.5",
    "kr8s>=0.20.15",
    "prometheus-client>=0.25.0",
    "pydantic>=2.13.1",
    "pydantic-settings>=2.13.1",
    "pynetbox>=7.5.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.11",
]

[tool.coverage.run]
relative_files = true
